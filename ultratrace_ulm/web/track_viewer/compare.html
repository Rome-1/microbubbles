<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>

    <script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import GUI from "lil-gui";

// ============================================================
// Shaders
// ============================================================

const vertexShader = `
precision highp float;

attribute float aSpeed;
attribute float aIntensity;
attribute float aRandom;
attribute float aFrame;

uniform float u_pointSize;
uniform float u_pixelRatio;
uniform float u_jitter;
uniform float u_time;
uniform float u_speedFilter;
uniform float u_speedBand;
uniform float u_reveal;
uniform float u_edge;
uniform int u_useIntensity;

varying float vSpeed;
varying float vIntensity;
varying float vGlow;

void main() {
  vSpeed = aSpeed;
  vIntensity = aIntensity;
  vGlow = 0.0;

  // Progressive accumulation: only show samples whose (normalised) time has been
  // reached by the reveal front. Past samples persist, so the super-resolution
  // vessel map visibly builds up over the cycle, then resets and replays.
  if (aFrame > u_reveal) {
    gl_PointSize = 0.0;
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }

  if (u_speedFilter > 0.0 && abs(aSpeed - u_speedFilter) > u_speedBand) {
    gl_PointSize = 0.0;
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }

  // Bright, slightly larger moving front at the leading edge of the reveal.
  vGlow = u_edge > 0.0 ? clamp(1.0 - (u_reveal - aFrame) / u_edge, 0.0, 1.0) : 0.0;

  float seed = aRandom * 6.2831;
  vec3 pos = position + u_jitter * vec3(
    sin(seed * 13.7 + u_time * 2.1),
    sin(seed * 17.3 + u_time * 1.7),
    sin(seed * 11.1 + u_time * 2.5)
  );

  vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
  float dist = -mvPosition.z;
  float size = u_pointSize * u_pixelRatio * (300.0 / max(dist, 1.0));

  if (u_useIntensity == 1) {
    size *= aIntensity;
  }
  size *= (1.0 + 1.6 * vGlow);

  gl_PointSize = size;
  gl_Position = projectionMatrix * mvPosition;
}
`;

const fragmentShader = `
precision highp float;

varying float vSpeed;
varying float vIntensity;
varying float vGlow;

uniform float u_maxSpeed;
uniform int u_colormap;
uniform int u_useIntensity;
uniform int u_useSolid;
uniform vec3 u_solidColor;

vec3 cmapJet(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.25) return mix(vec3(0.1, 0.2, 0.8), vec3(0.0, 0.7, 0.9), t / 0.25);
  if (t < 0.5)  return mix(vec3(0.0, 0.7, 0.9), vec3(0.1, 0.9, 0.2), (t - 0.25) / 0.25);
  if (t < 0.75) return mix(vec3(0.1, 0.9, 0.2), vec3(0.95, 0.85, 0.1), (t - 0.5) / 0.25);
  return mix(vec3(0.95, 0.85, 0.1), vec3(0.9, 0.1, 0.1), (t - 0.75) / 0.25);
}

vec3 cmapInferno(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.33) return mix(vec3(0.0, 0.0, 0.04), vec3(0.55, 0.1, 0.52), t / 0.33);
  if (t < 0.66) return mix(vec3(0.55, 0.1, 0.52), vec3(0.93, 0.47, 0.1), (t - 0.33) / 0.33);
  return mix(vec3(0.93, 0.47, 0.1), vec3(0.99, 0.96, 0.64), (t - 0.66) / 0.34);
}

vec3 cmapViridis(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.33) return mix(vec3(0.27, 0.0, 0.33), vec3(0.17, 0.32, 0.54), t / 0.33);
  if (t < 0.66) return mix(vec3(0.17, 0.32, 0.54), vec3(0.13, 0.66, 0.47), (t - 0.33) / 0.33);
  return mix(vec3(0.13, 0.66, 0.47), vec3(0.99, 0.91, 0.14), (t - 0.66) / 0.34);
}

vec3 cmapTurbo(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.2)  return mix(vec3(0.19, 0.07, 0.23), vec3(0.16, 0.34, 0.85), t / 0.2);
  if (t < 0.4)  return mix(vec3(0.16, 0.34, 0.85), vec3(0.06, 0.72, 0.65), (t - 0.2) / 0.2);
  if (t < 0.6)  return mix(vec3(0.06, 0.72, 0.65), vec3(0.44, 0.88, 0.12), (t - 0.4) / 0.2);
  if (t < 0.8)  return mix(vec3(0.44, 0.88, 0.12), vec3(0.95, 0.65, 0.04), (t - 0.6) / 0.2);
  return mix(vec3(0.95, 0.65, 0.04), vec3(0.76, 0.15, 0.11), (t - 0.8) / 0.2);
}

vec3 applyColormap(float t) {
  if (u_colormap == 1) return cmapInferno(t);
  if (u_colormap == 2) return cmapViridis(t);
  if (u_colormap == 3) return cmapTurbo(t);
  return cmapJet(t);
}

void main() {
  vec2 cxy = 2.0 * gl_PointCoord - 1.0;
  float r2 = dot(cxy, cxy);
  if (r2 > 1.0) discard;

  float t;
  if (u_useIntensity == 1) {
    t = vIntensity;
  } else {
    t = vSpeed / max(u_maxSpeed, 0.001);
  }

  // Overlay mode drops the shared speed colormap for a per-dataset hue -- with
  // two point clouds interleaved, identity has to win over the speed readout.
  // Speed still modulates brightness so structure does not flatten out.
  vec3 color;
  if (u_useSolid == 1) {
    color = u_solidColor * (0.35 + 0.85 * clamp(t, 0.0, 1.0));
  } else {
    color = applyColormap(t);
  }
  color = mix(color, vec3(1.0), 0.7 * vGlow);

  gl_FragColor = vec4(color, 1.0);
}
`;

// ============================================================
// TrackLoader
// ============================================================

const MAGIC = 0x554c4d54;

async function loadTracks(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Failed to load ${url}: ${response.status}`);
  const buffer = await response.arrayBuffer();

  const headerView = new DataView(buffer, 0, 64);
  const magic = headerView.getUint32(0, true);
  if (magic !== MAGIC) throw new Error(`Bad magic in ${url}: 0x${magic.toString(16)}`);

  const version = headerView.getUint32(4, true);
  if (version !== 2 && version !== 3) throw new Error(`Unsupported version: ${version}`);

  const floatsPerPoint = version >= 3 ? 6 : 5;
  const nTracks = headerView.getUint32(8, true);
  const totalPoints = headerView.getUint32(12, true);
  const maxSpeed = headerView.getFloat32(16, true);

  const boundsMin = [
    headerView.getFloat32(20, true),
    headerView.getFloat32(24, true),
    headerView.getFloat32(28, true),
  ];
  const boundsMax = [
    headerView.getFloat32(32, true),
    headerView.getFloat32(36, true),
    headerView.getFloat32(40, true),
  ];

  const tableOffset = 64;
  const tableView = new DataView(buffer, tableOffset, nTracks * 8);
  const tracks = new Array(nTracks);
  let sumLen = 0;
  let nGe35 = 0;
  for (let i = 0; i < nTracks; i++) {
    const length = tableView.getUint32(i * 8 + 4, true);
    tracks[i] = { pointOffset: tableView.getUint32(i * 8, true), length };
    sumLen += length;
    if (length >= 35) nGe35++;
  }

  const pointDataOffset = tableOffset + nTracks * 8;
  const pointData = new Float32Array(buffer, pointDataOffset, totalPoints * floatsPerPoint);

  return {
    nTracks, totalPoints, maxSpeed, boundsMin, boundsMax, tracks, pointData, floatsPerPoint,
    nGe35, meanLength: nTracks ? sumLen / nTracks : 0,
  };
}

// ============================================================
// TrackSystem
// ============================================================

class TrackSystem {
  constructor(trackData, solidColor) {
    this.trackData = trackData;
    const { nTracks, tracks, totalPoints, pointData } = trackData;
    const fpp = trackData.floatsPerPoint || 5;
    const hasIntensity = fpp >= 6;

    // Global time range across all samples. Frames are global across
    // acquisitions, so the reveal sweeps the recording in chronological order.
    let minFrame = Infinity;
    let maxFrame = -Infinity;
    for (let i = 0; i < nTracks; i++) {
      const off = tracks[i].pointOffset * fpp;
      const len = tracks[i].length;
      const f0 = pointData[off + 3];
      const f1 = pointData[off + (len - 1) * fpp + 3];
      if (f0 < minFrame) minFrame = f0;
      if (f1 > maxFrame) maxFrame = f1;
    }
    const span = Math.max(maxFrame - minFrame, 1);

    // One persistent vertex per track sample (no per-frame interpolation).
    const positions = new Float32Array(totalPoints * 3);
    const speeds = new Float32Array(totalPoints);
    const intensities = new Float32Array(totalPoints);
    const randoms = new Float32Array(totalPoints);
    const frames = new Float32Array(totalPoints);

    let k = 0;
    for (let i = 0; i < nTracks; i++) {
      const off = tracks[i].pointOffset * fpp;
      const len = tracks[i].length;
      for (let j = 0; j < len; j++) {
        const b = off + j * fpp;
        positions[k * 3] = pointData[b];
        positions[k * 3 + 1] = pointData[b + 1];
        positions[k * 3 + 2] = pointData[b + 2];
        speeds[k] = pointData[b + 4];
        intensities[k] = hasIntensity ? pointData[b + 5] : 1.0;
        randoms[k] = Math.random();
        frames[k] = (pointData[b + 3] - minFrame) / span;
        k++;
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aSpeed", new THREE.BufferAttribute(speeds, 1));
    geometry.setAttribute("aIntensity", new THREE.BufferAttribute(intensities, 1));
    geometry.setAttribute("aRandom", new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute("aFrame", new THREE.BufferAttribute(frames, 1));

    this.uniforms = {
      u_pointSize: { value: 0.3 },
      u_pixelRatio: { value: window.devicePixelRatio },
      u_maxSpeed: { value: trackData.maxSpeed * 0.5 },
      u_colormap: { value: 0 },
      u_jitter: { value: 0.0 },
      u_time: { value: 0.0 },
      u_speedFilter: { value: -1.0 },
      u_speedBand: { value: 0.08 },
      u_useIntensity: { value: 0 },
      u_reveal: { value: 0.0 },
      u_edge: { value: 0.04 },
      u_useSolid: { value: 0 },
      u_solidColor: { value: new THREE.Color(solidColor) },
    };

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms: this.uniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending,
    });

    this.points = new THREE.Points(geometry, material);
    this.points.visible = false;
  }

  getObject3D() {
    return this.points;
  }

  setReveal(reveal, time) {
    this.uniforms.u_time.value = time;
    this.uniforms.u_reveal.value = Math.min(reveal, 1.0);
  }

  setRenderParams({ pointSize, maxSpeed, colormap, jitter, speedFilter, useIntensity, useSolid }) {
    if (pointSize !== undefined) this.uniforms.u_pointSize.value = pointSize;
    if (maxSpeed !== undefined) this.uniforms.u_maxSpeed.value = maxSpeed;
    if (colormap !== undefined) this.uniforms.u_colormap.value = colormap;
    if (jitter !== undefined) this.uniforms.u_jitter.value = jitter;
    if (speedFilter !== undefined) this.uniforms.u_speedFilter.value = speedFilter;
    if (useIntensity !== undefined) this.uniforms.u_useIntensity.value = useIntensity ? 1 : 0;
    if (useSolid !== undefined) this.uniforms.u_useSolid.value = useSolid ? 1 : 0;
    this.uniforms.u_speedBand.value = this.trackData.maxSpeed * 0.02;
  }
}

// ============================================================
// Datasets
// ============================================================

const DATASETS = [
  { key: "reference",  label: "REFERENCE (Aleph)",       file: "data/reference.bin",       color: 0x4fa8ff },
  { key: "recreation", label: "RECREATION (ours)",       file: "data/recreation.bin",      color: 0xff8a3d },
  { key: "reference5", label: "REFERENCE as released",   file: "data/reference_min5.bin",  color: 0x9d7bff },
];
// Filter floors are informational only -- the bins are already filtered by the
// exporter; these strings just keep the HUD from lying about what is on screen.
const FLOORS = { reference: "len >= 15", recreation: "len >= 15", reference5: "len >= 5 (their release)" };

const MODES = [
  { key: "reference",  hotkey: "1", label: "Reference" },
  { key: "recreation", hotkey: "2", label: "Recreation" },
  { key: "both",       hotkey: "3", label: "Both" },
  { key: "reference5", hotkey: "4", label: "Ref @5" },
];

// ============================================================
// App
// ============================================================

const params = {
  speedMultiplier: 20.0,
  pointSize: 0.3762,
  maxSpeed: 0.1713,
  colormap: 0,
  speedFilter: 0.0,
  useIntensity: false,
  paused: false,
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x010104);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.up.set(0, 0, 1);
camera.position.set(15, 10, 30);

const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.05;
orbitControls.target.set(0, 0, 15);
orbitControls.update();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new OutputPass());

const systems = {};   // key -> TrackSystem
const data = {};      // key -> trackData
let mode = "reference";

const hudTitle = document.getElementById("hud-title");
const hudDot = document.getElementById("hud-dot");
const statsEl = document.getElementById("stats");
const legendEl = document.getElementById("legend");
const errEl = document.getElementById("err");

function hex(c) { return "#" + c.toString(16).padStart(6, "0"); }

function row(k, v) {
  return `<div><span>${k}</span><span class="v">${v}</span></div>`;
}

function statBlock(key) {
  const d = data[key];
  if (!d) return row("status", "missing");
  return row("tracks", d.nTracks.toLocaleString())
       + row("tracks &ge; 35", d.nGe35.toLocaleString())
       + row("mean length", d.meanLength.toFixed(2) + " pts")
       + row("points", d.totalPoints.toLocaleString())
       + row("filter", FLOORS[key]);
}

function updateHUD() {
  if (mode === "both") {
    const ref = DATASETS[0], rec = DATASETS[1];
    hudDot.style.background = "linear-gradient(90deg," + hex(ref.color) + " 50%," + hex(rec.color) + " 50%)";
    hudTitle.textContent = "BOTH (overlay)";
    statsEl.innerHTML =
      `<div style="margin:6px 0 2px;color:${hex(ref.color)}">${ref.label}</div>` + statBlock("reference") +
      `<div style="margin:8px 0 2px;color:${hex(rec.color)}">${rec.label}</div>` + statBlock("recreation");
    legendEl.style.display = "block";
    legendEl.innerHTML =
      `<span class="dot" style="background:${hex(ref.color)}"></span>reference &nbsp;` +
      `<span class="dot" style="background:${hex(rec.color)}"></span>recreation ` +
      `<br />brightness = speed`;
  } else {
    const ds = DATASETS.find((d) => d.key === mode);
    hudDot.style.background = hex(ds.color);
    hudTitle.textContent = ds.label;
    statsEl.innerHTML = statBlock(mode);
    legendEl.style.display = "block";
    legendEl.innerHTML = "color = speed (jet, 0 &rarr; max)";
  }
  for (const b of document.querySelectorAll("#modes button")) {
    b.classList.toggle("active", b.dataset.mode === mode);
  }
}

function setMode(next) {
  if (!systems[next] && next !== "both") return;
  if (next === "both" && !(systems.reference && systems.recreation)) return;
  mode = next;
  // Camera and controls are never touched here -- the whole point is that the
  // two datasets land on the same pixels when you flip between them.
  for (const [key, sys] of Object.entries(systems)) {
    const on = mode === "both" ? (key === "reference" || key === "recreation") : key === mode;
    sys.getObject3D().visible = on;
    sys.setRenderParams({ useSolid: mode === "both" });
  }
  updateHUD();
}

function applyParams() {
  for (const sys of Object.values(systems)) {
    sys.setRenderParams({
      pointSize: params.pointSize,
      maxSpeed: params.maxSpeed,
      colormap: params.colormap,
      speedFilter: params.speedFilter,
      useIntensity: params.useIntensity,
    });
  }
}

function buildModeButtons() {
  const container = document.getElementById("modes");
  container.innerHTML = "";
  for (const m of MODES) {
    const b = document.createElement("button");
    b.textContent = `${m.hotkey}  ${m.label}`;
    b.dataset.mode = m.key;
    b.addEventListener("click", () => setMode(m.key));
    container.appendChild(b);
  }
}

async function init() {
  buildModeButtons();
  const loaded = [];
  for (const ds of DATASETS) {
    try {
      data[ds.key] = await loadTracks(ds.file);
      systems[ds.key] = new TrackSystem(data[ds.key], ds.color);
      scene.add(systems[ds.key].getObject3D());
      loaded.push(ds.key);
    } catch (err) {
      console.error(err);
      errEl.textContent = `${ds.key}: ${err.message}`;
    }
  }
  if (!loaded.length) {
    hudTitle.textContent = "No data loaded";
    return;
  }

  // Frame the union of every loaded dataset so no toggle moves the camera.
  const bmin = new THREE.Vector3(Infinity, Infinity, Infinity);
  const bmax = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
  for (const key of loaded) {
    bmin.min(new THREE.Vector3(...data[key].boundsMin));
    bmax.max(new THREE.Vector3(...data[key].boundsMax));
  }
  const size = bmax.clone().sub(bmin);
  const center = bmin.clone().add(size.clone().multiplyScalar(0.5));

  const boxEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(size.x, size.y, size.z));
  const boxLine = new THREE.LineSegments(
    boxEdges, new THREE.LineBasicMaterial({ color: 0x333355 })
  );
  boxLine.position.copy(center);
  scene.add(boxLine);

  orbitControls.target.copy(center);
  camera.position.set(center.x, center.y + Math.max(size.x, size.z) * 1.2, center.z);
  orbitControls.update();

  const gui = new GUI({ title: "Render" });
  gui.add(params, "speedMultiplier", 1, 240).name("Speed (frames/s)");
  gui.add(params, "pointSize", 0.05, 1.5).name("Point size").onChange(applyParams);
  const maxSpd = Math.max(...loaded.map((k) => data[k].maxSpeed));
  gui.add(params, "maxSpeed", 0.01, maxSpd).name("Colormap max speed").onChange(applyParams);
  gui.add(params, "speedFilter", 0, maxSpd).name("Speed filter").onChange(applyParams);
  gui.add(params, "paused").name("Pause reveal");
  gui.close();

  applyParams();
  setMode(loaded.includes("reference") ? "reference" : loaded[0]);
}

// Shared reveal clock: both datasets accumulate in lockstep, so a mid-sweep
// toggle compares the same slice of recording time, not two different ones.
let reveal = 0.0;
let elapsed = 0.0;
const HOLD_FRACTION = 0.18;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  orbitControls.update();
  if (!params.paused) {
    elapsed += dt;
    reveal += dt * (Math.max(params.speedMultiplier, 1.0) / 240.0);
    const cycle = 1.0 + HOLD_FRACTION;
    if (reveal > cycle) reveal -= cycle;
  }
  for (const sys of Object.values(systems)) sys.setReveal(reveal, elapsed);
  composer.render();
}

window.addEventListener("keydown", (e) => {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  const byHotkey = MODES.find((m) => m.hotkey === e.key);
  if (byHotkey) { setMode(byHotkey.key); e.preventDefault(); return; }
  if (e.key === " " || e.key === "Tab") {
    setMode(mode === "recreation" ? "reference" : "recreation");
    e.preventDefault();
  } else if (e.key === "p" || e.key === "P") {
    params.paused = !params.paused;
  } else if (e.key === "r" || e.key === "R") {
    reveal = 0.0;
  }
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

init();
animate();
    </script>
  </body>
</html>
