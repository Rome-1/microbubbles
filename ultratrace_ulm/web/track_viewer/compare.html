<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reference vs. Recreation vs. Improved</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font: 13px/1.5 ui-monospace, monospace; color: #fff; }
      canvas { display: block; }
      #hud {
        position: absolute; top: 14px; left: 14px;
        background: rgba(4,4,10,0.72);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 6px; padding: 12px 14px; min-width: 292px;
        user-select: none;
      }
      #hud h1 { font-size: 15px; letter-spacing: 0.02em; margin-bottom: 10px; }
      #hud h1 .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
      #stats { color: rgba(255,255,255,0.78); }
      #stats div { display: flex; justify-content: space-between; gap: 18px; }
      #stats span.v { color: #fff; }
      #modes { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
      #modes button {
        font: inherit; font-size: 12px; cursor: pointer;
        background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.75);
        border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
        padding: 4px 9px;
      }
      #modes button:hover { background: rgba(255,255,255,0.14); }
      #modes button.active { background: #fff; color: #000; border-color: #fff; }
      #hint { margin-top: 10px; color: rgba(255,255,255,0.42); font-size: 11px; }
      #legend { margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.6); display: none; }
      #legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      #err { color: #ff7070; margin-top: 8px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
        }
      }

  </head>
  <body>
    <div id="hud">
      <h1><span class="dot" id="hud-dot"></span><span id="hud-title">Loading…</span></h1>
      <div id="stats"></div>
      <div id="legend"></div>
      <div id="modes"></div>
      <div id="hint">
        <b>1</b> reference &nbsp; <b>2</b> recreation &nbsp; <b>3</b> improved &nbsp; <b>4</b> overlay<br />
        <b>m</b> matched &ge;15 &nbsp; <b>n</b> native floors &nbsp; <b>h</b> only &ge;35<br />
        <b>space</b> / <b>tab</b> cycle the three &nbsp;&middot;&nbsp; <b>p</b> pause &nbsp;&middot;&nbsp;
        <b>r</b> restart sweep &nbsp;&middot;&nbsp; drag to orbit
      </div>
      <div id="err"></div>
    </div>
    <script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import GUI from "lil-gui";

// ============================================================
// Shaders
// ============================================================

const vertexShader = `
precision highp float;

attribute float aSpeed;
attribute float aIntensity;
attribute float aRandom;
attribute float aFrame;
attribute float aLen;

uniform float u_pointSize;
uniform float u_pixelRatio;
uniform float u_jitter;
uniform float u_time;
uniform float u_minLength;
uniform float u_speedFilter;
uniform float u_speedBand;
uniform float u_reveal;
uniform float u_edge;
uniform int u_useIntensity;

varying float vSpeed;
varying float vIntensity;
varying float vGlow;

void main() {
  vSpeed = aSpeed;
  vIntensity = aIntensity;
  vGlow = 0.0;

  // Progressive accumulation: only show samples whose (normalised) time has been
  // reached by the reveal front. Past samples persist, so the super-resolution
  // vessel map visibly builds up over the cycle, then resets and replays.
  // Length floor is applied here, not in the exporter: every dataset is packed
  // once at its own native floor and every higher cutoff (matched >=15, the
  // >=35 headline) is this one comparison, so the views can never drift apart.
  if (aLen < u_minLength) {
    gl_PointSize = 0.0;
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }

  if (aFrame > u_reveal) {
    gl_PointSize = 0.0;
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }

  if (u_speedFilter > 0.0 && abs(aSpeed - u_speedFilter) > u_speedBand) {
    gl_PointSize = 0.0;
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }

  // Bright, slightly larger moving front at the leading edge of the reveal.
  vGlow = u_edge > 0.0 ? clamp(1.0 - (u_reveal - aFrame) / u_edge, 0.0, 1.0) : 0.0;

  float seed = aRandom * 6.2831;
  vec3 pos = position + u_jitter * vec3(
    sin(seed * 13.7 + u_time * 2.1),
    sin(seed * 17.3 + u_time * 1.7),
    sin(seed * 11.1 + u_time * 2.5)
  );

  vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
  float dist = -mvPosition.z;
  float size = u_pointSize * u_pixelRatio * (300.0 / max(dist, 1.0));

  if (u_useIntensity == 1) {
    size *= aIntensity;
  }
  size *= (1.0 + 1.6 * vGlow);

  gl_PointSize = size;
  gl_Position = projectionMatrix * mvPosition;
}
`;

const fragmentShader = `
precision highp float;

varying float vSpeed;
varying float vIntensity;
varying float vGlow;

uniform float u_maxSpeed;
uniform int u_colormap;
uniform int u_useIntensity;
uniform int u_useSolid;
uniform vec3 u_solidColor;

vec3 cmapJet(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.25) return mix(vec3(0.1, 0.2, 0.8), vec3(0.0, 0.7, 0.9), t / 0.25);
  if (t < 0.5)  return mix(vec3(0.0, 0.7, 0.9), vec3(0.1, 0.9, 0.2), (t - 0.25) / 0.25);
  if (t < 0.75) return mix(vec3(0.1, 0.9, 0.2), vec3(0.95, 0.85, 0.1), (t - 0.5) / 0.25);
  return mix(vec3(0.95, 0.85, 0.1), vec3(0.9, 0.1, 0.1), (t - 0.75) / 0.25);
}

vec3 cmapInferno(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.33) return mix(vec3(0.0, 0.0, 0.04), vec3(0.55, 0.1, 0.52), t / 0.33);
  if (t < 0.66) return mix(vec3(0.55, 0.1, 0.52), vec3(0.93, 0.47, 0.1), (t - 0.33) / 0.33);
  return mix(vec3(0.93, 0.47, 0.1), vec3(0.99, 0.96, 0.64), (t - 0.66) / 0.34);
}

vec3 cmapViridis(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.33) return mix(vec3(0.27, 0.0, 0.33), vec3(0.17, 0.32, 0.54), t / 0.33);
  if (t < 0.66) return mix(vec3(0.17, 0.32, 0.54), vec3(0.13, 0.66, 0.47), (t - 0.33) / 0.33);
  return mix(vec3(0.13, 0.66, 0.47), vec3(0.99, 0.91, 0.14), (t - 0.66) / 0.34);
}

vec3 cmapTurbo(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.2)  return mix(vec3(0.19, 0.07, 0.23), vec3(0.16, 0.34, 0.85), t / 0.2);
  if (t < 0.4)  return mix(vec3(0.16, 0.34, 0.85), vec3(0.06, 0.72, 0.65), (t - 0.2) / 0.2);
  if (t < 0.6)  return mix(vec3(0.06, 0.72, 0.65), vec3(0.44, 0.88, 0.12), (t - 0.4) / 0.2);
  if (t < 0.8)  return mix(vec3(0.44, 0.88, 0.12), vec3(0.95, 0.65, 0.04), (t - 0.6) / 0.2);
  return mix(vec3(0.95, 0.65, 0.04), vec3(0.76, 0.15, 0.11), (t - 0.8) / 0.2);
}

vec3 applyColormap(float t) {
  if (u_colormap == 1) return cmapInferno(t);
  if (u_colormap == 2) return cmapViridis(t);
  if (u_colormap == 3) return cmapTurbo(t);
  return cmapJet(t);
}

void main() {
  vec2 cxy = 2.0 * gl_PointCoord - 1.0;
  float r2 = dot(cxy, cxy);
  if (r2 > 1.0) discard;

  float t;
  if (u_useIntensity == 1) {
    t = vIntensity;
  } else {
    t = vSpeed / max(u_maxSpeed, 0.001);
  }

  // Overlay mode drops the shared speed colormap for a per-dataset hue -- with
  // two point clouds interleaved, identity has to win over the speed readout.
  // Speed still modulates brightness so structure does not flatten out.
  vec3 color;
  if (u_useSolid == 1) {
    color = u_solidColor * (0.35 + 0.85 * clamp(t, 0.0, 1.0));
  } else {
    color = applyColormap(t);
  }
  color = mix(color, vec3(1.0), 0.7 * vGlow);

  gl_FragColor = vec4(color, 1.0);
}
`;

// ============================================================
// TrackLoader
// ============================================================

const MAGIC = 0x554c4d54;

async function loadTracks(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Failed to load ${url}: ${response.status}`);
  const buffer = await response.arrayBuffer();

  const headerView = new DataView(buffer, 0, 64);
  const magic = headerView.getUint32(0, true);
  if (magic !== MAGIC) throw new Error(`Bad magic in ${url}: 0x${magic.toString(16)}`);

  const version = headerView.getUint32(4, true);
  if (version !== 2 && version !== 3) throw new Error(`Unsupported version: ${version}`);

  const floatsPerPoint = version >= 3 ? 6 : 5;
  const nTracks = headerView.getUint32(8, true);
  const totalPoints = headerView.getUint32(12, true);
  const maxSpeed = headerView.getFloat32(16, true);

  const boundsMin = [
    headerView.getFloat32(20, true),
    headerView.getFloat32(24, true),
    headerView.getFloat32(28, true),
  ];
  const boundsMax = [
    headerView.getFloat32(32, true),
    headerView.getFloat32(36, true),
    headerView.getFloat32(40, true),
  ];

  const tableOffset = 64;
  const tableView = new DataView(buffer, tableOffset, nTracks * 8);
  const tracks = new Array(nTracks);
  const lengths = new Int32Array(nTracks);
  for (let i = 0; i < nTracks; i++) {
    const length = tableView.getUint32(i * 8 + 4, true);
    tracks[i] = { pointOffset: tableView.getUint32(i * 8, true), length };
    lengths[i] = length;
  }

  const pointDataOffset = tableOffset + nTracks * 8;
  const pointData = new Float32Array(buffer, pointDataOffset, totalPoints * floatsPerPoint);

  return {
    nTracks, totalPoints, maxSpeed, boundsMin, boundsMax, tracks, lengths,
    pointData, floatsPerPoint,
  };
}

// Restat a dataset at an arbitrary length floor. The bins are packed at each
// dataset's native floor and never re-exported, so every number the HUD shows
// at every floor is derived from the same bytes that are on screen.
function statsAtFloor(d, floor) {
  let n = 0, sum = 0, ge35 = 0;
  for (let i = 0; i < d.lengths.length; i++) {
    const L = d.lengths[i];
    if (L < floor) continue;
    n++; sum += L;
    if (L >= 35) ge35++;
  }
  return { n, ge35, points: sum, meanLength: n ? sum / n : 0 };
}

// ============================================================
// TrackSystem
// ============================================================

class TrackSystem {
  constructor(trackData, solidColor) {
    this.trackData = trackData;
    const { nTracks, tracks, totalPoints, pointData } = trackData;
    const fpp = trackData.floatsPerPoint || 5;
    const hasIntensity = fpp >= 6;

    // Global time range across all samples. Frames are global across
    // acquisitions, so the reveal sweeps the recording in chronological order.
    let minFrame = Infinity;
    let maxFrame = -Infinity;
    for (let i = 0; i < nTracks; i++) {
      const off = tracks[i].pointOffset * fpp;
      const len = tracks[i].length;
      const f0 = pointData[off + 3];
      const f1 = pointData[off + (len - 1) * fpp + 3];
      if (f0 < minFrame) minFrame = f0;
      if (f1 > maxFrame) maxFrame = f1;
    }
    const span = Math.max(maxFrame - minFrame, 1);

    // One persistent vertex per track sample (no per-frame interpolation).
    const positions = new Float32Array(totalPoints * 3);
    const speeds = new Float32Array(totalPoints);
    const intensities = new Float32Array(totalPoints);
    const randoms = new Float32Array(totalPoints);
    const frames = new Float32Array(totalPoints);
    const lens = new Float32Array(totalPoints);

    let k = 0;
    for (let i = 0; i < nTracks; i++) {
      const off = tracks[i].pointOffset * fpp;
      const len = tracks[i].length;
      for (let j = 0; j < len; j++) {
        const b = off + j * fpp;
        positions[k * 3] = pointData[b];
        positions[k * 3 + 1] = pointData[b + 1];
        positions[k * 3 + 2] = pointData[b + 2];
        speeds[k] = pointData[b + 4];
        intensities[k] = hasIntensity ? pointData[b + 5] : 1.0;
        randoms[k] = Math.random();
        frames[k] = (pointData[b + 3] - minFrame) / span;
        lens[k] = len;
        k++;
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aSpeed", new THREE.BufferAttribute(speeds, 1));
    geometry.setAttribute("aIntensity", new THREE.BufferAttribute(intensities, 1));
    geometry.setAttribute("aRandom", new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute("aFrame", new THREE.BufferAttribute(frames, 1));
    geometry.setAttribute("aLen", new THREE.BufferAttribute(lens, 1));

    this.uniforms = {
      u_pointSize: { value: 0.3 },
      u_pixelRatio: { value: window.devicePixelRatio },
      u_maxSpeed: { value: trackData.maxSpeed * 0.5 },
      u_colormap: { value: 0 },
      u_jitter: { value: 0.0 },
      u_time: { value: 0.0 },
      u_minLength: { value: 0.0 },
      u_speedFilter: { value: -1.0 },
      u_speedBand: { value: 0.08 },
      u_useIntensity: { value: 0 },
      u_reveal: { value: 0.0 },
      u_edge: { value: 0.04 },
      u_useSolid: { value: 0 },
      u_solidColor: { value: new THREE.Color(solidColor) },
    };

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms: this.uniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending,
    });

    this.points = new THREE.Points(geometry, material);
    this.points.visible = false;
  }

  getObject3D() {
    return this.points;
  }

  setReveal(reveal, time) {
    this.uniforms.u_time.value = time;
    this.uniforms.u_reveal.value = Math.min(reveal, 1.0);
  }

  setMinLength(floor) {
    this.uniforms.u_minLength.value = floor;
  }

  setRenderParams({ pointSize, maxSpeed, colormap, jitter, speedFilter, useIntensity, useSolid }) {
    if (pointSize !== undefined) this.uniforms.u_pointSize.value = pointSize;
    if (maxSpeed !== undefined) this.uniforms.u_maxSpeed.value = maxSpeed;
    if (colormap !== undefined) this.uniforms.u_colormap.value = colormap;
    if (jitter !== undefined) this.uniforms.u_jitter.value = jitter;
    if (speedFilter !== undefined) this.uniforms.u_speedFilter.value = speedFilter;
    if (useIntensity !== undefined) this.uniforms.u_useIntensity.value = useIntensity ? 1 : 0;
    if (useSolid !== undefined) this.uniforms.u_useSolid.value = useSolid ? 1 : 0;
    this.uniforms.u_speedBand.value = this.trackData.maxSpeed * 0.02;
  }
}

// ============================================================
// Datasets
// ============================================================

// Colours are identity-only; they matter in overlay mode, where the shared
// speed colormap has to give way to "which run drew this point".
const COLORS = {
  reference:  0x4fa8ff,
  recreation: 0xff8a3d,
  improved:   0x46e08a,
};
const ORDER = ["reference", "recreation", "improved"];

let META = null;
let DATASETS = [];   // filled from data/meta.json

// Three length floors over the SAME bins:
//   matched  -- all three at >=15. The default, and the only like-for-like view.
//   native   -- each run at the floor it actually published (5 / 15 / 8).
//               NOT like-for-like: a run that emits shorter tracks looks denser.
//   headline -- >=35 only. Above every native floor here, so it is the one
//               count no floor choice can flatter.
const FLOOR_MODES = [
  { key: "matched",  hotkey: "m", label: "Matched >=15" },
  { key: "native",   hotkey: "n", label: "Native floors" },
  { key: "headline", hotkey: "h", label: "Only >=35" },
];

const MODES = [
  { key: "reference",  hotkey: "1", label: "Reference" },
  { key: "recreation", hotkey: "2", label: "Recreation" },
  { key: "improved",   hotkey: "3", label: "Improved" },
  { key: "overlay",    hotkey: "4", label: "Overlay" },
];

// ============================================================
// App
// ============================================================

const params = {
  speedMultiplier: 20.0,
  pointSize: 0.3762,
  maxSpeed: 0.1713,
  colormap: 0,
  speedFilter: 0.0,
  useIntensity: false,
  paused: false,
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x010104);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.up.set(0, 0, 1);
camera.position.set(15, 10, 30);

const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.05;
orbitControls.target.set(0, 0, 15);
orbitControls.update();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new OutputPass());

const systems = {};   // key -> TrackSystem
const data = {};      // key -> trackData
let mode = "reference";
let floorMode = "matched";

const hudTitle = document.getElementById("hud-title");
const hudDot = document.getElementById("hud-dot");
const statsEl = document.getElementById("stats");
const legendEl = document.getElementById("legend");
const errEl = document.getElementById("err");

function hex(c) { return "#" + c.toString(16).padStart(6, "0"); }

function row(k, v) {
  return `<div><span>${k}</span><span class="v">${v}</span></div>`;
}

function dsOf(key) { return DATASETS.find((d) => d.key === key); }

// The floor actually in force for a dataset under the current floor mode.
function floorFor(key) {
  if (floorMode === "native") return dsOf(key).native_floor;
  if (floorMode === "headline") return META.headline_floor;
  return META.matched_floor;
}

function purityText(ds) {
  if (ds.purity_pct == null) return "not measured";
  return ds.purity_pct.toFixed(1) + "%";
}

function statBlock(key) {
  const d = data[key];
  if (!d) return row("status", "missing");
  const ds = dsOf(key);
  const floor = floorFor(key);
  const st = statsAtFloor(d, floor);
  return row("floor in force", "len &ge; " + floor)
       + row("tracks", st.n.toLocaleString())
       + row("tracks &ge; 35", st.ge35.toLocaleString())
       + row("mean length", st.meanLength.toFixed(2) + " pts")
       + row("points", st.points.toLocaleString())
       + row("purity", purityText(ds))
       + row("native floor", "len &ge; " + ds.native_floor);
}

function floorBanner() {
  if (floorMode === "native") {
    return `<div style="margin-top:8px;color:#ffc65c;font-size:11px">` +
      `NATIVE FLOORS &mdash; not like-for-like. Each run is drawn at the ` +
      `min_track_length it published (5 / 15 / 8), so a run that emits shorter ` +
      `tracks looks denser for that reason alone.</div>`;
  }
  if (floorMode === "headline") {
    return `<div style="margin-top:8px;color:rgba(255,255,255,0.55);font-size:11px">` +
      `Tracks &ge; 35 frames only &mdash; above every native floor here, so this ` +
      `count is independent of the floor each run chose.</div>`;
  }
  return `<div style="margin-top:8px;color:rgba(255,255,255,0.55);font-size:11px">` +
    `Matched floor &ge; ${META.matched_floor} on all three &mdash; the like-for-like view.</div>`;
}

function updateHUD() {
  if (mode === "overlay") {
    hudDot.style.background = "linear-gradient(90deg," +
      ORDER.map((k, i) => `${hex(COLORS[k])} ${i * 33.4}% ${(i + 1) * 33.4}%`).join(",") + ")";
    hudTitle.textContent = "OVERLAY (all three)";
    statsEl.innerHTML = ORDER.filter((k) => data[k]).map((k) =>
      `<div style="margin:6px 0 2px;color:${hex(COLORS[k])}">${dsOf(k).label}</div>` + statBlock(k)
    ).join("");
    legendEl.style.display = "block";
    legendEl.innerHTML = ORDER.filter((k) => data[k]).map((k) =>
      `<span class="dot" style="background:${hex(COLORS[k])}"></span>${k}`).join(" &nbsp;") +
      "<br />brightness = speed" + floorBanner();
  } else {
    const ds = dsOf(mode);
    hudDot.style.background = hex(COLORS[mode]);
    hudTitle.textContent = ds.label;
    statsEl.innerHTML = statBlock(mode);
    legendEl.style.display = "block";
    legendEl.innerHTML = "color = speed (jet, 0 &rarr; max, shared scale)" +
      (ds.purity_note ? `<br />purity ${purityText(ds)} ${ds.purity_note}` : "") +
      floorBanner();
  }
  for (const b of document.querySelectorAll("#modes button")) {
    if (b.dataset.mode) b.classList.toggle("active", b.dataset.mode === mode);
    if (b.dataset.floor) b.classList.toggle("active", b.dataset.floor === floorMode);
  }
}

function applyFloors() {
  for (const [key, sys] of Object.entries(systems)) sys.setMinLength(floorFor(key));
}

function setFloorMode(next) {
  if (!FLOOR_MODES.some((f) => f.key === next)) return;
  floorMode = next;
  applyFloors();
  updateHUD();
}

function setMode(next) {
  if (next !== "overlay" && !systems[next]) return;
  mode = next;
  // Camera, controls and the reveal clock are never touched here -- the whole
  // point is that the three runs land on the same pixels at the same moment in
  // the sweep when you flip between them.
  for (const [key, sys] of Object.entries(systems)) {
    sys.getObject3D().visible = mode === "overlay" ? true : key === mode;
    sys.setRenderParams({ useSolid: mode === "overlay" });
  }
  updateHUD();
}

function cycleMode(step) {
  const live = ORDER.filter((k) => systems[k]);
  if (!live.length) return;
  const i = live.indexOf(mode);
  setMode(live[(((i < 0 ? 0 : i + step) % live.length) + live.length) % live.length]);
}

function buildModeButtons() {
  const container = document.getElementById("modes");
  container.innerHTML = "";
  for (const m of MODES) {
    const b = document.createElement("button");
    b.textContent = `${m.hotkey}  ${m.label}`;
    b.dataset.mode = m.key;
    b.addEventListener("click", () => setMode(m.key));
    container.appendChild(b);
  }
  const br = document.createElement("div");
  br.style.flexBasis = "100%";
  container.appendChild(br);
  for (const f of FLOOR_MODES) {
    const b = document.createElement("button");
    b.textContent = `${f.hotkey}  ${f.label}`;
    b.dataset.floor = f.key;
    b.addEventListener("click", () => setFloorMode(f.key));
    container.appendChild(b);
  }
}

async function init() {
  buildModeButtons();
  try {
    META = await (await fetch("data/meta.json")).json();
  } catch (err) {
    errEl.textContent = "meta.json: " + err.message;
    hudTitle.textContent = "No metadata";
    return;
  }
  DATASETS = META.datasets;

  const loaded = [];
  for (const ds of DATASETS) {
    try {
      data[ds.key] = await loadTracks(ds.file);
      systems[ds.key] = new TrackSystem(data[ds.key], COLORS[ds.key] ?? 0xffffff);
      scene.add(systems[ds.key].getObject3D());
      loaded.push(ds.key);
    } catch (err) {
      console.error(err);
      errEl.textContent = `${ds.key}: ${err.message}`;
    }
  }
  if (!loaded.length) {
    hudTitle.textContent = "No data loaded";
    return;
  }

  // Frame the union of every loaded dataset so no toggle moves the camera.
  const bmin = new THREE.Vector3(Infinity, Infinity, Infinity);
  const bmax = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
  for (const key of loaded) {
    bmin.min(new THREE.Vector3(...data[key].boundsMin));
    bmax.max(new THREE.Vector3(...data[key].boundsMax));
  }
  const size = bmax.clone().sub(bmin);
  const center = bmin.clone().add(size.clone().multiplyScalar(0.5));

  const boxEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(size.x, size.y, size.z));
  const boxLine = new THREE.LineSegments(
    boxEdges, new THREE.LineBasicMaterial({ color: 0x333355 })
  );
  boxLine.position.copy(center);
  scene.add(boxLine);

  orbitControls.target.copy(center);
  camera.position.set(center.x, center.y + Math.max(size.x, size.z) * 1.2, center.z);
  orbitControls.update();

  const gui = new GUI({ title: "Render" });
  gui.add(params, "speedMultiplier", 1, 240).name("Speed (frames/s)");
  gui.add(params, "pointSize", 0.05, 1.5).name("Point size").onChange(applyParams);
  // One colormap ceiling for all three: the speed colouring is only comparable
  // across datasets if they share the scale, so it is a single global control.
  const maxSpd = Math.max(...loaded.map((k) => data[k].maxSpeed));
  gui.add(params, "maxSpeed", 0.01, maxSpd).name("Colormap max speed").onChange(applyParams);
  gui.add(params, "speedFilter", 0, maxSpd).name("Speed filter").onChange(applyParams);
  gui.add(params, "paused").name("Pause reveal");
  gui.close();

  applyParams();
  setFloorMode("matched");
  setMode(loaded.includes("reference") ? "reference" : loaded[0]);
}

// Shared reveal clock: both datasets accumulate in lockstep, so a mid-sweep
// toggle compares the same slice of recording time, not two different ones.
let reveal = 0.0;
let elapsed = 0.0;
const HOLD_FRACTION = 0.18;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  orbitControls.update();
  if (!params.paused) {
    elapsed += dt;
    reveal += dt * (Math.max(params.speedMultiplier, 1.0) / 240.0);
    const cycle = 1.0 + HOLD_FRACTION;
    if (reveal > cycle) reveal -= cycle;
  }
  for (const sys of Object.values(systems)) sys.setReveal(reveal, elapsed);
  composer.render();
}

window.addEventListener("keydown", (e) => {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  const byHotkey = MODES.find((m) => m.hotkey === e.key);
  if (byHotkey) { setMode(byHotkey.key); e.preventDefault(); return; }
  const byFloor = FLOOR_MODES.find((f) => f.hotkey === e.key.toLowerCase());
  if (byFloor) { setFloorMode(byFloor.key); e.preventDefault(); return; }
  if (e.key === " " || e.key === "Tab") {
    // Cycles reference -> recreation -> improved. Camera and the shared reveal
    // clock are untouched, so the three land on the same pixels at the same
    // moment of the sweep.
    cycleMode(e.shiftKey ? -1 : 1);
    e.preventDefault();
  } else if (e.key === "p" || e.key === "P") {
    params.paused = !params.paused;
  } else if (e.key === "r" || e.key === "R") {
    reveal = 0.0;
  }
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

init();
animate();
    </script>
  </body>
</html>
